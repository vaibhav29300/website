<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Eternal Rose for Ruchu</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(45deg, #ff0077, #ff1493, #ff69b4);
            overflow: hidden;
            font-family: 'Great Vibes', cursive;
        }

        .container {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .rose {
            width: 300px;
            height: 400px;
            position: relative;
            animation: bloom 2s forwards;
        }

        .rose svg {
            width: 100%;
            height: auto;
        }

        .message {
            color: white;
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s 2s forwards;
            margin-top: 30px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        @keyframes bloom {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); }
            100% { transform: translateY(-100vh) scale(1.5); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <div class="container">
        <div class="rose" id="rose">
            <!-- SVG Rose -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <!-- Add SVG path data for the rose -->
            </svg>
        </div>
        <div class="message">
            <h1>To My Forever Valentine, Ruchu</h1>
            <p>Like this rose, my love for you grows more beautiful with each passing day.<br>
            Wish you would be with me and i could give you a real rose but will celebrate our own valantine my love once you are here.<br>
            Happy Rose Day, my eternal love. 🌹❤️</p>
            <p>Forever Yours,<br>Vibhuti</p>
        </div>
    </div>

    <script>
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 50; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heartsContainer.appendChild(heart);
            }
        }

        window.onload = function() {
            createHearts();
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2574/2574-preview.mp3');
            audio.loop = true;
            audio.play().catch(() => { /* Handle autoplay restrictions */ });
        };
    </script>
</body>
</html>
